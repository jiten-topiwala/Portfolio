name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bake SEO from content JSON
        run: node scripts/seo-build.js   # regenerates meta/JSON-LD/crawler block, the per-project pages in p/, llms.txt, robots and sitemap

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.md,contact_form_guide.md'

      - name: Notify IndexNow of changed URLs
        if: success()
        continue-on-error: true          # never fail a deploy because a search engine was unreachable
        run: |
          sleep 45                       # let the published site go live before the URLs are fetched
          node scripts/indexnow.js
